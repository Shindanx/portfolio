<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>João Silva — Portfolio</title>

    <link rel="icon" type="image/png" href="images/Logo-Final.png" />
    <link rel="stylesheet" href="css/styles.css?v=lighting-33" />
    <script src="js/scripts.js?v=lighting-33" defer></script>
  </head>

  <body>
    <main
      class="desk"
      aria-label="Interactive portfolio desk"
      aria-describedby="deskInstructions"
      tabindex="0"
    >
      <p class="desk-instructions" id="deskInstructions">
        Drag or swipe diagonally to explore the desk.
      </p>

      <div class="desk-canvas">
        <!-- About -->
        <button
          class="desk-object notebook"
          data-section="about"
          aria-label="Open About Me"
        >
          <img src="images/Notebook.png" alt="" draggable="false" />
          <span class="object-label">About me</span>
        </button>

        <!-- UI/UX and web projects -->
        <button
          class="desk-object laptop"
          data-section="projects"
          aria-label="Open UI and web projects"
        >
          <span class="laptop-image">
            <img
              class="laptop-off"
              src="images/Laptop.png"
              alt=""
              draggable="false"
            />

            <img
              class="laptop-on"
              src="images/LaptopHover.png"
              alt=""
              draggable="false"
            />
          </span>

          <span class="object-label">Projects</span>
        </button>

        <!-- Video and photography -->
        <button
          class="desk-object camera"
          data-section="media"
          aria-label="Open photography and video work"
        >
          <img src="images/Camera.png" alt="" draggable="false" />
          <span class="object-label">Photo & video</span>
        </button>

        <!-- Contact -->
        <button
          class="desk-object phone"
          data-section="contact"
          aria-label="Open contact information"
        >
          <span class="phone-image">
            <img
              class="phone-off"
              src="images/PhoneOff.png"
              alt=""
              draggable="false"
            />

            <img
              class="phone-on"
              src="images/PhoneOn.png"
              alt=""
              draggable="false"
            />
          </span>

          <span class="object-label">Contact</span>
        </button>

        <!-- Branding -->
        <button
          class="desk-object koikuro"
          data-section="branding"
          aria-label="Open KoiKuro branding project"
        >
          <img src="images/DeliveryBag.png" alt="" draggable="false" />
          <span class="object-label">Branding</span>
        </button>

        <div class="desk-clock-control">
          <button
            class="desk-clock"
            id="deskClock"
            type="button"
            aria-label="Choose scene time"
            aria-expanded="false"
            aria-controls="deskTimeMenu"
          >
            <img
              class="desk-clock-art"
              src="images/AlarmClock.png?v=clock-shadow-2"
              alt=""
              draggable="false"
            />
            <span class="desk-clock-screen">
              <time class="desk-clock-time" id="deskClockTime">00:00</time>
              <span class="desk-clock-period" id="deskClockPeriod"
                >EVENING</span
              >
            </span>
          </button>
          <div
            class="desk-time-menu"
            id="deskTimeMenu"
            role="group"
            aria-label="Choose the scene lighting"
            hidden
          >
            <button
              type="button"
              data-time-mode="device"
              aria-label="Use device time"
            >
              <span class="time-mode-icon" aria-hidden="true">↻</span>
            </button>
            <button
              type="button"
              data-time-mode="morning"
              aria-label="Use early morning lighting"
            >
              <span class="time-mode-icon" aria-hidden="true">◒</span>
            </button>
            <button
              type="button"
              data-time-mode="midday"
              aria-label="Use midday lighting"
            >
              <span class="time-mode-icon" aria-hidden="true">☀</span>
            </button>
            <button
              type="button"
              data-time-mode="evening"
              aria-label="Use evening lighting"
            >
              <span class="time-mode-icon" aria-hidden="true">◐</span>
            </button>
            <button
              type="button"
              data-time-mode="night"
              aria-label="Use night lighting"
            >
              <span class="time-mode-icon" aria-hidden="true">☾</span>
            </button>
          </div>
        </div>

        <img
          class="desk-lighting-art desk-lighting-rays"
          src="images/SunRays.png?v=lighting-13"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
        <img
          class="desk-lighting-art desk-lighting-glow"
          src="images/ContactLights.png?v=lighting-13"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
        <img
          class="desk-lighting-art desk-lighting-contacts"
          src="images/ContactLights.png?v=lighting-13"
          alt=""
          aria-hidden="true"
          draggable="false"
        />
      </div>

      <div class="lighting-dark-filter" aria-hidden="true"></div>
      <div class="lighting-scene-wash" aria-hidden="true"></div>
      <div
        class="lighting-dust lighting-moves-with-desk"
        aria-hidden="true"
      ></div>
    </main>

    <!-- Reusable overlay -->
    <section class="portfolio-overlay" id="portfolioOverlay" aria-hidden="true">
      <div
        class="overlay-panel"
        id="overlayPanel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlayTitle"
      >
        <button
          class="overlay-close"
          id="overlayClose"
          aria-label="Close section"
        >
          ×
        </button>

        <div id="overlayContent"></div>
      </div>
    </section>
  </body>
</html>
